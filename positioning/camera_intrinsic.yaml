# RealSense D455 Camera Calibration
# Reference: https://dev.intelrealsense.com/docs/calibration-white-papers

# Camera model
camera_model: "RealSense_D455"
resolution: [1280, 720]  # Color stream resolution (adjust if you change config)
frame_rate: 30           # Hz

# Intrinsic matrix [ fx  0  cx ]
#                  [ 0  fy  cy ]
#                  [ 0   0   1 ]

# Factory typical values (from Intel datasheet @ 1280x720 resolution)
intrinsic_matrix:
  fx: 604.22668802    # focal length x (pixels) - scaled from 640x480 baseline
  fy: 607.02140168    # focal length y (pixels)
  cx: 653.39002234    # principal point x (image center)
  cy: 415.75246292    # principal point y (image center)

# Distortion coefficients [k1, k2, p1, p2, k3]
distortion:
  k1: -0.04394124    # radial distortion 1 (typical for D455)
  k2: 0.03501399   # radial distortion 2
  p1: 0.01298172   # tangential distortion 1
  p2: 0.00684472   # tangential distortion 2
  k3: -0.00835813   # radial distortion 3
